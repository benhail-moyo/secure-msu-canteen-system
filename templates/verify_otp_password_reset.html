{% extends "base.html" %}
{% block title %}Verify OTP - MSU Canteen{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2><i class="fas fa-shield-alt fa-fw me-2"></i>Verify OTP</h2>
                        <p class="text-muted mb-0">Enter the 6-digit code sent to your email</p>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="otp" class="form-label">OTP Code</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key"></i></span>
                                <input type="text" class="form-control text-center" id="otp" name="otp" 
                                       placeholder="000000" maxlength="6" pattern="[0-9]{6}" required 
                                       style="font-size: 1.5em; letter-spacing: 0.5em;">
                            </div>
                            <small class="text-muted">Enter the 6-digit code</small>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-check me-2"></i>Verify OTP
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <small class="text-muted">Didn't receive the code?</small><br>
                        <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">Request a new OTP</a>
                    </div>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('login') }}">Back to login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
