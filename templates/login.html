{% extends "base.html" %}
{% block title %}Login - MSU Canteen{% endblock %}

{% block content %}
<style>
    .login-bg-wrapper {
        position: relative;
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        background-color: #fbfbfb;
        overflow: hidden; /* Prevents scrollbars if images peek out */
    }

    /* Base style for both background illustrations */
    .bg-illustration {
        position: absolute;
        bottom: 0;
        width: 28%; /* Scales beautifully with the viewport width */
        max-width: 400px; /* Prevents them from getting monstrously huge on giant screens */
        height: auto;
        z-index: 1; /* Keeps them behind the login card */
    }

    /* Position the first image on the left */
    .bg-left {
        left: 2%;
    }

    /* Position the second image on the right */
    .bg-right {
        right: 2%;
    }

    /* Keep the main form container explicitly above the images */
    .login-content-container {
        position: relative;
        z-index: 2;
        width: 100%;
    }

    /* Responsive Design: Hide illustrations on tablets and mobile phones */
    @media (max-width: 992px) {
        .bg-illustration {
            display: none;
        }
    }
</style>

<div class="login-bg-wrapper">
    <img src="{{ url_for('static', filename='css/bckgrd-login.svg') }}" class="bg-illustration bg-left" alt="Left Vector">

    <img src="{{ url_for('static', filename='css/bckgrd-login 2.svg') }}" class="bg-illustration bg-right" alt="Right Vector">

    <div class="login-content-container">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card border-0 shadow">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <img src="{{ url_for('static', filename='css/logo.jpg') }}" 
                                     alt="MSU Logo" 
                                     class="msu-logo mb-3" 
                                     style="max-width: 250px; height: auto;">
                            </div>
                            
                            <form method="POST">
                                <div class="mb-3">
                                    <label for="student_id" class="form-label">Student ID</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                                        <input type="text" class="form-control" id="student_id" name="student_id" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                        <input type="password" class="form-control" id="password" name="password" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt me-2"></i>Login</button>
                            </form>
                            
                            <hr>
                            <p class="text-center mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
