{% extends "base.html" %}
{% block title %}Login - MSU Canteen{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
    <img src="{{ url_for('static', filename='css/logo.jpg') }}" 
         alt="MSU Logo" 
         class="msu-logo mb-3" 
         style="max-width: 250px; height: auto;">

  
</div>
                    {% include "_login_roles.html" %}
                    <form method="POST">
                        <div class="mb-3">
                            <label for="student_id" class="form-label">Student ID or Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                                <input type="text" class="form-control" id="student_id" name="student_id" value="{{ request.form.get('student_id', '') }}" required autocomplete="username" placeholder="e.g. R210001X or name@gmail.com">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt me-2"></i>Login</button>
                    </form>
                    <p class="text-center mt-3 mb-0"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p>
                    <hr>
                    <p class="text-center mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
