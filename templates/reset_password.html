{% extends "base.html" %}
{% block title %}Reset Password - MSU Canteen{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4"><i class="fas fa-lock-open text-primary me-2"></i>Reset Password</h2>
                    <p class="text-muted text-center mb-4">Enter your new password</p>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="new_password" class="form-label">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="new_password" name="new_password" required minlength="6">
                            </div>
                            <small class="text-muted">Minimum 6 characters</small>
                        </div>

                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save me-2"></i>Reset Password</button>
                    </form>
                    <hr>
                    <p class="text-center mb-0"><a href="{{ url_for('login') }}">Back to login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
